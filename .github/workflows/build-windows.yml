
name: Build AI Backend Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Verify required files
        working-directory: backend
        run: |
          $requiredFiles = @(
            "requirements.lock.txt",
            "run_server.py",
            ".env.example"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Missing backend/$file"
            }
          }

          Write-Host "Required build files found."

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pip install -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pip install pyinstaller python-dotenv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify core dependencies
        working-directory: backend
        run: |
          python -c "import uvicorn, fastapi, duckdb, sqlalchemy, pydantic_settings, dotenv; print('Core dependencies OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build executable
        working-directory: backend
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --console `
            --name AIBackend `
            --paths . `
            --collect-submodules app `
            --collect-all uvicorn `
            --collect-all fastapi `
            --collect-all azure `
            --collect-all duckdb `
            --collect-all docling `
            --collect-all docling_core `
            --collect-all docling_parse `
            --collect-all docling_ibm_models `
            --hidden-import dotenv `
            run_server.py

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path "dist/AIBackend/AIBackend.exe")) {
            throw "AIBackend.exe was not generated"
          }

          Write-Host "Executable generated successfully."

      - name: Prepare customer environment
        working-directory: backend
        run: |
          Copy-Item `
            -Path ".env.example" `
            -Destination "dist/AIBackend/.env" `
            -Force

          if (-not (Test-Path "dist/AIBackend/.env")) {
            throw "Failed to create customer .env"
          }

          Write-Host "Customer environment template prepared."

      - name: Verify executable structure
        working-directory: backend
        run: |
          $requiredPaths = @(
            "dist/AIBackend/AIBackend.exe",
            "dist/AIBackend/_internal",
            "dist/AIBackend/.env"
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) {
              throw "Missing build output: $path"
            }
          }

          Write-Host "Executable structure OK."

      - name: Create ZIP
        run: |
          Compress-Archive `
            -Path "backend/dist/AIBackend" `
            -DestinationPath "AI-Backend-Windows.zip" `
            -Force

          if (-not (Test-Path "AI-Backend-Windows.zip")) {
            throw "ZIP creation failed"
          }

          $zip = Get-Item "AI-Backend-Windows.zip"
          Write-Host "ZIP size: $($zip.Length) bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Backend-Windows
          path: AI-Backend-Windows.zip
          if-no-files-found: error
          retention-days: 7
