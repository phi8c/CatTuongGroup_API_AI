name: Build CTG AI Backend Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Verify build inputs
        working-directory: backend
        run: |
          foreach ($file in @('requirements.lock.txt', 'run_server.py', '.env.example', '.env.dummy', 'app/services/temp/temp_file_service.py')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing backend/$file"
            }
          }

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .build-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = '.\.build-venv\Scripts\python.exe'
          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify library imports without loading application
        working-directory: backend
        run: |
          $python = '.\.build-venv\Scripts\python.exe'
          & $python -c "import uvicorn, fastapi, duckdb, sqlalchemy, pydantic_settings, dotenv, aiohttp, asyncpg; from azure.core.pipeline.transport import AioHttpTransport; from azure.search.documents.aio import SearchClient; from azure.ai.documentintelligence import DocumentIntelligenceClient; print('Dependencies OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify local startup with public env templates
        working-directory: backend
        env:
          CTG_ENV_FILE: .env.example
          CHAT_WARMUP_ENABLED: "false"
        run: |
          $python = '.\.build-venv\Scripts\python.exe'
          & $python -m unittest tests.api.test_local_startup tests.api.test_ai_backend_cleanup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows executable
        working-directory: backend
        run: |
          $python = '.\.build-venv\Scripts\python.exe'
          & $python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --console `
            --name AIBackend `
            --paths . `
            --collect-submodules app `
            --collect-all uvicorn `
            --collect-all fastapi `
            --collect-all azure `
            --collect-all duckdb `
            --collect-all aiohttp `
            --hidden-import azure.core.pipeline.transport._aiohttp `
            --hidden-import azure.search.documents.aio `
            --hidden-import azure.ai.documentintelligence `
            --hidden-import asyncpg `
            --hidden-import sqlalchemy.dialects.postgresql.asyncpg `
            --hidden-import dotenv `
            run_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare output and verify bundled Python runtime
        working-directory: backend
        run: |
          $out = 'dist\AIBackend'
          Copy-Item -LiteralPath '.env.example' -Destination "$out\.env.example" -Force
          Copy-Item -LiteralPath '.env.dummy' -Destination "$out\.env.dummy" -Force
          foreach ($path in @("$out\AIBackend.exe", "$out\_internal", "$out\_internal\base_library.zip", "$out\.env.example")) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing build output: $path" }
          }
          Write-Host 'EXE, Python runtime and environment template present.'

      - name: Create and verify ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'CTG-AI-Backend-Windows.zip'
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path 'backend\dist').Path,
            $zipPath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            foreach ($entry in @('AIBackend/AIBackend.exe', 'AIBackend/_internal/base_library.zip', 'AIBackend/.env.example')) {
              if ($entries -notcontains $entry) { throw "Missing ZIP entry: $entry" }
            }
          }
          finally { $zip.Dispose() }
          Write-Host "Build ZIP ready: $zipPath"

      - name: Smoke test EXE from extracted ZIP without private configuration
        env:
          API_HOST: 127.0.0.1
          API_PORT: "18080"
          CHAT_WARMUP_ENABLED: "false"
        run: |
          $ErrorActionPreference = 'Stop'
          $extractDir = Join-Path $env:RUNNER_TEMP "ctg-exe-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Expand-Archive -LiteralPath 'CTG-AI-Backend-Windows.zip' -DestinationPath $extractDir -Force
          $exe = Join-Path $extractDir 'AIBackend\AIBackend.exe'
          # Start outside the application directory to catch relative-path mistakes.
          foreach ($template in @('', '.env.example', '.env.dummy')) {
            if ($template) { $env:CTG_ENV_FILE = $template }
            else { Remove-Item Env:CTG_ENV_FILE -ErrorAction SilentlyContinue }
            $label = if ($template) { $template.TrimStart('.') } else { 'automatic' }
            $stdout = Join-Path $env:RUNNER_TEMP "ctg-$label-stdout.log"
            $stderr = Join-Path $env:RUNNER_TEMP "ctg-$label-stderr.log"
            $process = $null
            try {
              $process = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
              $ready = $false
              for ($attempt = 1; $attempt -le 45; $attempt++) {
                Start-Sleep -Seconds 2
                $process.Refresh()
                if ($process.HasExited) { throw "EXE exited with code $($process.ExitCode) using $label" }
                try {
                  $schema = Invoke-RestMethod -Uri 'http://127.0.0.1:18080/openapi.json' -TimeoutSec 3
                }
                catch { continue }
                if (-not $schema.openapi -or -not $schema.paths.'/documents/acl/sync') {
                  throw 'EXE OpenAPI is missing the ACL sync endpoint'
                }
                $docs = Invoke-WebRequest -Uri 'http://127.0.0.1:18080/docs' -TimeoutSec 3
                if ($docs.StatusCode -ne 200) { throw 'EXE API docs are unavailable' }
                $ready = $true
                break
              }
              if (-not $ready) { throw "EXE startup timed out using $label" }
              Write-Host "Packaged EXE startup passed using $label"
            }
            finally {
              if ($null -ne $process) {
                $process.Refresh()
                if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
              }
              foreach ($log in @($stdout, $stderr)) {
                if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 100 }
              }
            }
          }

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CTG-build-diagnostics
          path: |
            ${{ runner.temp }}/ctg-*-stdout.log
            ${{ runner.temp }}/ctg-*-stderr.log
            backend/build/AIBackend/warn-AIBackend.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CTG-AI-Backend-Windows
          path: CTG-AI-Backend-Windows.zip
          if-no-files-found: error
          retention-days: 7
